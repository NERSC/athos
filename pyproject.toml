[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athos"
version = "0.1.0"
description = "ATHOS - Agentic HPC support framework"
authors = [{name = "NERSC"}]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "openai-agents>=0.2.4,<1.0.0",
    "mcp[cli]>=1.12.2,<2.0.0",
    "smolagents[mcp,gradio]>=1.20.0",
    "ddgs",
    "markdownify",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "requests",
    "python-dotenv",
    "httpx",
    "PyYAML",
    "fastmcp>=2.10.6",
    "authlib",
    "ipykernel",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.36",
  ]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pydantic[email]>=2.11.7,<3.0.0",
]

[project.scripts]
athos = "athos.main:cli"
servicenow-mcp = "athos.tools.servicenow_mcp.cli:main"
nersc-sfapi-mcp = "athos.tools.sfapi_mcp.server:cli"
rag-mcp = "athos.tools.rag_mcp.rag_mcp_server:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
