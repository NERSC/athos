[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athos"
version = "0.1.0"
description = "ATHOS - Agentic HPC support framework"
authors = [{name = "NERSC"}]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "openai-agents>=0.0.19,<0.1.0",
    "mcp[cli]>=1.9.4,<1.10.0",
    "smolagents[mcp]>=1.19.0,<2.0.0",
    "duckduckgo_search",
    "markdownify",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pydantic[email]>=2.0.0,<3.0.0",
]

[project.scripts]
servicenow-mcp = "athos.tools.servicenow_mcp.cli:main"
servicenow-mcp-sse = "athos.tools.servicenow_mcp.server_sse:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
