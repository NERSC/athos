[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athos"
version = "0.1.0"
description = "ATHOS - Agentic HPC support framework"
authors = [{name = "NERSC"}]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "openai-agents>=0.2.4,<1.0.0",
    "mcp[cli]>=1.12.2,<2.0.0",
    "smolagents[mcp,gradio]>=1.24.0",
    "mcpadapt>=0.1.19,<0.1.20; python_version < '3.12'",
    "mcpadapt>=0.1.20; python_version >= '3.12'",
    "ddgs",
    "markdownify",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "requests",
    "python-dotenv",
    "httpx",
    "PyYAML",
    "matplotlib",
    "fastmcp>=2.10.6",
    "authlib",
    "ipykernel",
    "uv",
    "langchain~=1.0.0",
    "langchain-core~=1.0.0",
    "langchain-openai~=1.0.0",
    "langchain-mcp-adapters==0.1.14",
    "langchain-community~=0.4",
    "langgraph~=1.0.0",
    "langchain-tavily",
    "chromadb~=1.5.0",
    "chroma-mcp",
  ]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pydantic[email]>=2.11.7,<3.0.0",
]
chroma-embeddings = [
    "sentence-transformers",
    "onnx",
]

[project.scripts]
athos = "athos.main:cli"
servicenow-mcp = "athos.tools.servicenow_mcp.cli:main"
nersc-sfapi-mcp = "athos.tools.sfapi_mcp.server:cli"
rag-mcp = "athos.tools.rag_mcp.rag_mcp_server:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests that mock external systems",
    "integration: cross-component or IO-oriented tests",
    "slow: opt-in slow-running tests",
]

[tool.setuptools.packages.find]
where = ["src"]
