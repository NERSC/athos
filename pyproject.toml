[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athos"
version = "0.1.0"
description = "ATHOS - Agentic HPC support framework"
authors = [{name = "NERSC"}]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "openai-agents>=0.0.19,<0.1.0",
    "smolagents>=1.19.0,<2.0.0",
    "duckduckgo_search",
    "markdownify",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
