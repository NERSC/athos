[tool.poetry]
name = "athos"
version = "0.1.0"
description = "ATHOS monorepo for agentic HPC support"
authors = ["NERSC"]

[tool.poetry.dependencies]
python = ">=3.8"
athos-core = { path = "athos-core", develop = true }
athos-tools = { path = "athos-tools", develop = true }
athos-agents = { path = "athos-agents", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

