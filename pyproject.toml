[tool.poetry]
name = "athos"
version = "0.1.0"
description = "ATHOS - Agentic HPC support framework"
authors = ["NERSC"]
packages = [{ include = "athos", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.8"
openai = "^1.0.0"
openai-agents = "^0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"