# ATHOS Configuration File
# Example configuration for HPC operations toolkit

# Root workspace shared by MCP servers and tools. Set ATHOS_WORKSPACE to override.
workspace_dir: "${ATHOS_WORKSPACE:-/tmp/athos_workspace}"

# Model instances that can be used by agents
models:

  # OpenAI GPT-4o model
  gpt_4o:
    description: "Primary GPT-4o model used for general-purpose reasoning"
    model_id: "openai/gpt-4o"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  gpt_5:
    description: "Placeholder for GPT-5 when available"
    model_id: "openai/gpt-5"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # CBORG chat model
  cborg_chat:
    description: "CBORG chat model tuned for conversational support"
    model_id: "lbl/cborg-chat:latest"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # CBORG coder model
  cborg_coder:
    description: "CBORG coder model optimized for tool and code generation"
    model_id: "lbl/cborg-coder:latest"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.3
    max_tokens: 4096

  # Anthropic Claude Sonnet model
  claude_sonnet:
    description: "Anthropic Claude Sonnet model used for code-capable agents"
    model_id: "anthropic/claude-sonnet"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # OpenAI o4-mini model
  o4_mini:
    description: "Smaller OpenAI o4-mini model suitable for lightweight tasks"
    model_id: "openai/o4-mini"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.5
    max_tokens: 1024

# MCP servers
mcp_servers:
  # WARNING: filesystem_mcp is given edit privs in specified directory below
  filesystem_mcp:
    description: "Local filesystem MCP server with read/write access to the workspace"
    mcp_type: "mcp_stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${ATHOS_WORKSPACE}"]
    instructions: |
      Always use keyword arguments when invoking filesystem tools.
      Filesystem tools return strings only - use string.split('\n') to get lists, never assume .items() or .keys() exist.

  servicenow_mcp:
    description: "ServiceNow integration MCP server for ticket management"
    mcp_type: "mcp_stdio"
    command: "servicenow-mcp"
    env:
      SERVICENOW_INSTANCE_URL: "${SERVICENOW_INSTANCE_URL}"
      SERVICENOW_USERNAME: "${SERVICENOW_USERNAME}"
      SERVICENOW_PASSWORD: "${SERVICENOW_PASSWORD}"

  sfapi_mcp:
    description: "NERSC Superfacility API MCP server"
    mcp_type: "mcp_stdio"
    command: "nersc-sfapi-mcp"
    env:
      NERSC_CLIENT_ID: "${NERSC_CLIENT_ID}"
      NERSC_PRIVATE_KEY_PATH: "${NERSC_PRIVATE_KEY_PATH}"

  docs_rag_mcp:
    description: "Retrieval-augmented MCP for public NERSC documentation"
    mcp_type: "mcp_stdio"
    command: "rag-mcp"
    args: [
      "--repo-url", "https://gitlab.com/NERSC/nersc.gitlab.io.git",
      "--docs-path", "${ATHOS_WORKSPACE}/docs",
      "--chunk-size", "200",
      "--overlap", "50",
      "--query-name", "query_docs",
      "--query-docstring", "Query the NERSC public documentation"
    ]
    instructions: |
      Use the `query_docs` tool to answer questions about NERSC public documentation.

  consulting_docs_rag_mcp:
    description: "Retrieval-augmented MCP for internal consulting documentation"
    mcp_type: "mcp_stdio"
    command: "rag-mcp"
    args: [
      "--repo-url", "https://gitlab.nersc.gov/nersc/consulting/consulting-documentation.git",
      "--docs-path", "${ATHOS_WORKSPACE}/consulting_docs",
      "--chunk-size", "200",
      "--overlap", "50",
      "--query-name", "query_consulting_docs",
      "--query-docstring", "Query the NERSC internal consultant documentation"
    ]
    instructions: |
      Use the `query_consulting_docs` tool to answer questions about NERSC internal consultant documentation.


# Regular and custom tools (non-MCP)
tools:
  websearch:
    description: "DuckDuckGo search tool for general web queries"
    callable_name: "DuckDuckGoSearchTool"
    module_path: "smolagents.default_tools"
    parameters: {}
    framework: "smolagents"
  langgraph_websearch:
    description: "LangChain DuckDuckGo search tool for LangGraph flows"
    callable_name: "DuckDuckGoSearchRun"
    module_path: "langchain_community.tools"
    parameters: {}
    framework: "langgraph"
  webvisit:
    description: "Fetch and summarize webpages for agents"
    callable_name: "VisitWebpageTool"
    module_path: "smolagents.default_tools"
    parameters: {}
    framework: "smolagents"

  # You need a free tavily API key for this one:
  # https://python.langchain.com/docs/integrations/tools/tavily_search/
  langchain_tavily_search:
    description: "LangChain Tavily search engine tool for AI"
    module_path: "langchain_tavily"
    callable_name: "TavilySearch"
    parameters: {}
    framework: "langgraph"


# Agent flows define the agent system
flows:
  # Simple chatbot for general HPC questions
  hpc_chatbot:
    description: "Chatbot that answers general HPC questions using CBORG chat"
    type: "chatbot"
    model: "cborg_chat"
    system_prompt: |
      You are an HPC support chatbot. Answer questions about cluster usage, 
      job submission, software modules, and general HPC best practices.
      Keep responses concise but informative.

  # Web agent example
  web_agent:
    description: "Web-enabled agent leveraging DuckDuckGo and webpage tools"
    type: "agent"
    agent_type: "tool_calling"
    model: "o4_mini"
    tools: ["websearch", "webvisit"]

  # MCP-enabled agent example
  filesystem_agent:
    description: "Code agent with filesystem MCP access"
    type: "agent"
    agent_type: "code"
    model: "claude_sonnet"
    mcp_servers: ["filesystem_mcp"]

  # ServiceNow integration agent
  servicenow_agent:
    description: "Code agent for interacting with ServiceNow"
    type: "agent"
    agent_type: "code"
    model: "claude_sonnet"
    mcp_servers: ["servicenow_mcp"]
    additional_authorized_imports: ["json"]
    verbosity_level: 1  # 0: ERROR, 1: INFO, 2: DEBUG

  # Agent which can call the superfacility API tools
  sfapi_agent:
    description: "Agent preconfigured for Superfacility API workflows"
    type: "agent"
    agent_type: "code"
    model: "claude_sonnet"
    additional_authorized_imports: ["json"]
    mcp_servers: ["sfapi_mcp"]

  # Agent equipped with simple retrieval tools for NERSC docs and consulting docs
  docs_rag_agent:
    description: "Agent that uses documentation RAG MCP servers for retrieval"
    type: "agent"
    agent_type: "code"
    model: "claude_sonnet"
    mcp_servers: ["docs_rag_mcp", "consulting_docs_rag_mcp"]
    verbosity_level: 2  # 0: ERROR, 1: INFO, 2: DEBUG

  # Agent that can interact with servicenow and read from docs
  hpc_consultant:
    description: "Consultant agent that combines ServiceNow and documentation tools"
    type: "agent"
    agent_type: "code"
    model: "claude_sonnet"
    additional_authorized_imports: ["json"]
    mcp_servers: ["servicenow_mcp", "docs_rag_mcp", "consulting_docs_rag_mcp", "filesystem_mcp"]
    instructions: |
      You are an HPC consultant at NERSC who helps users in ServiceNow incidents.
      When you are asked to help on a specified incident, you should:
      - Paste your thoughts into the work notes and your replies to the user in the comments.
      - Use the NERSC documentation to provide accurate answers.
      - Update the incident state appropriately. Use "Awaiting User Info" when the user should reply.
      - When the issue is resolved, add some closure notes that summarize the outcomes.
      - If you need to download attachments, download them to your configured workspace.

  # LangGraph chatbot flow example
  langgraph_chatbot_demo:
    description: "Minimal LangGraph chatbot flow using the CBORG chat model"
    type: "langgraph_chatbot"
    model: "cborg_coder"
    system_prompt: |
      You are a friendly assistant helping users explore the LangGraph chatbot flow
      example. Provide concise, welcoming responses and let users know how you can help.
    # initial_history:
    #   - "Hello!"
    #   - "Hi there! I'm the LangGraph chatbot example ready to assist you."

  # langgraph_react_web_agent_demo:
  #   description: "LangGraph ReAct agent that uses DuckDuckGo search for web answers"
  #   type: "langgraph_react_agent"
  #   model: "cborg_coder"
  #   tools: ["langchain_tavily_search"]
  #   instructions: |
  #     You are a friendly assistant help users with questions. Always consider using
  #     a web search tool before responding so you can reference up-to-date information.
  #     Summarize the findings concisely in your reply.
  #   max_iterations: 16

  langchain_web_agent:
    description: "LangChain agent demo with web search tool"
    type: "langchain_agent"
    model: "cborg_coder"
    tools: ["langchain_tavily_search"]
    instructions: |
      You are a helpful research assistant. Use the web search tool when it would add
      useful, current information to your answer. Cite the sources you rely on and keep
      replies concise and actionable. Put any cited URLs at the end of your message.
    max_iterations: 32

  # Agent which can call the superfacility API tools
  lc_sfapi_agent:
    description: "LangChain agent preconfigured for Superfacility API workflows"
    type: "langchain_agent"
    model: "cborg_coder"
    mcp_servers: ["sfapi_mcp"]
    instructions: |
      You are a helpful HPC assistant that can use API tools to query information
      about HPC systems at NERSC. Be concise but technically oriented in your replies.
      Do your very best to help the user with their questions.
    max_iterations: 12

  # Agent equipped with simple retrieval tools for NERSC docs and consulting docs
  lc_docs_agent:
    description: "Agent that uses documentation RAG MCP servers for retrieval"
    type: "langchain_agent"
    model: "cborg_coder"
    mcp_servers: ["docs_rag_mcp", "consulting_docs_rag_mcp"]
    instructions: |
      You are a helpful NERSC HPC assistant that has access to documentation to help
      answer user queries. You have access to the NERSC public docs as well as the
      NERSC internal consulting documentation for staff. Provide detailed technical
      answers to user questions. Offer to follow up with additional information
      depending on context. If you are unable to find the information you need in the docs,
      you may be able to propose some NERSC folks to reach out to get better answers.
    max_iterations: 32

  # MCP-enabled agent example
  lc_filesystem_agent:
    description: "Agent with filesystem MCP access"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["filesystem_mcp"]
    instructions: |
      You are a helpful HPC assistant that can use tools to interact with files and
      directories in a filesystem. You may only interact with allowed filesystem paths.
      Always approach a problem by first thinking through what you need to do and communicating
      your plan before you begin. Iterate on the steps of your plan and observe the outcomes
      before moving on. Use your skills to the best of your ability to help the user with
      their requested tasks. Be cautious not to make mistakes when editing files or folders!
      When you've completed your task, don't forget to review your work and give a detailed
      summary.
    max_iterations: 32

  docs_react_agent:
    description: "Agent that uses documentation RAG MCP servers for retrieval"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["docs_rag_mcp", "consulting_docs_rag_mcp"]
    max_iterations: 32
    instructions: |
      You are **NERSC-AI**, a helpful and knowledgeable HPC assistant for the National Energy Research Scientific Computing Center (NERSC).
      You support users with technical questions about NERSC systems, software environments, data management, and AI/HPC workflows.
      You have access to multiple **retrieval tools** that can search NERSC’s **public documentation** and **internal consulting knowledge base**.

      **Your Goal**
      Provide accurate, detailed, and context-aware answers to user questions by reasoning step-by-step, using available documentation sources when helpful.
      When information is missing or unclear, make reasonable inferences and suggest follow-up actions such as contacting NERSC staff or reviewing additional resources.

      **Behavior and Output Format (ReAct pattern)**
      You must think and act explicitly in an agentic reasoning loop with the following structure:
        Thought: Describe what you are trying to understand or how you plan to approach it.
        Action: Specify which tool you will use (e.g., SearchDocs, GetDocContent) and what query you will perform.
        Observation: Summarize what was found or learned from the action.
      Repeat **Thought → Action → Observation** as needed.
      **IMPORTANT: ALWAYS START WITH A THOUGHT STEP, BEFORE CALLING ANY TOOLS.**
      You should acknowledge the user's request and describe what you're going to do **BEFORE** you do it.
      After gathering enough evidence, produce your final answer:
        Final Answer: Provide a clear, well-structured technical explanation or solution.

      **Tool Usage Rules**
        * **Docs Search Tools:** Use these to retrieve relevant information from the NERSC public documentation and internal consulting guides. Always cite or paraphrase results when forming your final answer.
        * **If no results are found:** State this explicitly, then reason based on your prior HPC knowledge or propose contacting relevant NERSC staff (e.g., system administrators, AI Services team).
        * Prefer **precision queries** (targeted, technical keywords) first, then broaden if necessary.
        * Always summarize retrieved material in your own words — do not just quote it verbatim.

      **Answer Style Guidelines**
        * Be **technical and detailed**, with actionable explanations or commands when appropriate.
        * Where relevant, include:
          * Example command lines or configuration snippets.
          * Key NERSC systems, software modules, or environment variables.
          * Relevant URLs or document sections.
        * Offer to **follow up or refine** based on context (e.g., “Would you like me to check internal notes on Perlmutter NCCL tuning?”).
        * If multiple interpretations exist, **list possible explanations** and their pros/cons.

      **Failure Handling**
      If you cannot find a direct answer:
      1. Clearly state the information gap.
      2. Suggest the most relevant NERSC experts, teams, or documentation areas to consult.
      3. Optionally propose next steps (e.g., opening a ServiceNow ticket, checking recent changelogs, etc.).

      **Personality and Tone**
      * Professional, precise, and collaborative.
      * Write like a senior HPC consultant familiar with NERSC infrastructure.
      * Avoid filler or speculation — be confident when you know, transparent when you don’t.

      Example of Desired Flow

      User: How do I enable MPI+GPU jobs on Perlmutter?

      Thought: I recall Perlmutter uses Slurm with CUDA-aware MPI, but I should verify module and launcher details.
      Action: SearchDocs("MPI GPU Perlmutter site:nersc.gov or internal consulting guide")
      Observation: Found guidance showing to load cudatoolkit and cray-mpich with --gpu-bind=closest and use srun --mpi=pmi2.
      Final Answer:
      On Perlmutter, load the GPU-enabled Cray MPI stack and use srun’s GPU binding:
        module load cudatoolkit cray-mpich
        srun --mpi=pmi2 --gpu-bind=closest ./my_mpi_app
      The `--gpu-bind` flag ensures correct rank-to-GPU affinity.
      For multi-node runs, see the internal “MPI and GPU Binding” doc or consult the NERSC Consulting team.

# Logging configuration
logging_config:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: "file"
      filename: "logs/athos.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
    - type: "console"
