# ATHOS Configuration File
# Example configuration for HPC operations toolkit

# Root workspace shared by MCP servers and tools. Set ATHOS_WORKSPACE to override.
workspace_dir: "${ATHOS_WORKSPACE:-/tmp/athos_workspace}"

# Model instances that can be used by agents
models:

  # OpenAI GPT-4o model
  gpt_4o:
    description: "Primary GPT-4o model used for general-purpose reasoning"
    model_id: "openai/gpt-4o"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  gpt_5:
    description: "Placeholder for GPT-5 when available"
    model_id: "openai/gpt-5"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  gptoss:
    description: "Open-weight GPT-OSS-120B via CBORG"
    model_id: "lbl/gpt-oss-120b"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.3
    max_tokens: 16384

  # CBORG chat model
  cborg_chat:
    description: "CBORG chat model tuned for conversational support"
    model_id: "lbl/cborg-chat"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # CBORG coder model
  cborg_coder:
    description: "CBORG coder model optimized for tool and code generation"
    model_id: "lbl/cborg-coder"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.3
    max_tokens: 16384

  # Anthropic Claude Sonnet model
  claude_sonnet:
    description: "Anthropic Claude Sonnet model used for code-capable agents"
    model_id: "anthropic/claude-sonnet"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # OpenAI o4-mini model
  o4_mini:
    description: "Smaller OpenAI o4-mini model suitable for lightweight tasks"
    model_id: "openai/o4-mini"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.5
    max_tokens: 1024

# MCP servers
mcp_servers:
  # WARNING: filesystem_mcp is given edit privs in specified directory below
  filesystem_mcp:
    description: "Local filesystem MCP server with read/write access to the workspace"
    mcp_type: "mcp_stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${ATHOS_WORKSPACE}"]
    instructions: |
      Always use keyword arguments when invoking filesystem tools.
      Filesystem tools return strings only - use string.split('\n') to get lists, never assume .items() or .keys() exist.

  servicenow_mcp:
    description: "ServiceNow integration MCP server for ticket management"
    mcp_type: "mcp_stdio"
    command: "servicenow-mcp"
    env:
      SERVICENOW_INSTANCE_URL: "${SERVICENOW_INSTANCE_URL}"
      SERVICENOW_USERNAME: "${SERVICENOW_USERNAME}"
      SERVICENOW_PASSWORD: "${SERVICENOW_PASSWORD}"

  servicenow_ro_mcp:
    description: "Read-only ServiceNow MCP server for consultant support context"
    mcp_type: "mcp_stdio"
    command: "servicenow-mcp"
    args: ["--read-only"]
    env:
      SERVICENOW_INSTANCE_URL: "${SERVICENOW_INSTANCE_URL}"
      SERVICENOW_USERNAME: "${SERVICENOW_USERNAME}"
      SERVICENOW_PASSWORD: "${SERVICENOW_PASSWORD}"
    allowed_tools:
      - "list_incidents"
      - "view_incident_logs"
      - "get_incident_attachments"
      - "download_attachment"
      - "get_user"
      - "list_users"
      - "list_groups"
    blocked_tools:
      - "create_incident"
      - "update_incident"
      - "add_comment"
      - "resolve_incident"
    instructions: |
      This ServiceNow connection is read-only. Use it to inspect tickets,
      ticket activity, attachments, user records, and assignment groups. Resolve
      human-readable group names with list_groups before filtering incidents by
      assignment_group. The list_incidents query argument is plain-text search,
      not an encoded ServiceNow query. Do not attempt to update
      ticket fields, add comments, add work notes, assign incidents, or resolve
      incidents. If a response should be posted to ServiceNow, draft the exact
      suggested comment or work note for a human consultant to review.

  sfapi_mcp:
    description: "NERSC Superfacility API MCP server"
    mcp_type: "mcp_stdio"
    command: "nersc-sfapi-mcp"
    env:
      NERSC_CLIENT_ID: "${NERSC_CLIENT_ID}"
      NERSC_PRIVATE_KEY_PATH: "${NERSC_PRIVATE_KEY_PATH}"

  docs_rag_mcp:
    description: "Retrieval-augmented MCP for public NERSC documentation"
    mcp_type: "mcp_stdio"
    command: "rag-mcp"
    args: [
      "--repo-url", "https://gitlab.com/NERSC/nersc.gitlab.io.git",
      "--docs-path", "${ATHOS_WORKSPACE}/docs",
      "--chunk-size", "200",
      "--overlap", "50",
      "--query-name", "query_docs",
      "--query-docstring", "Query the NERSC public documentation"
    ]
    instructions: |
      Use the `query_docs` tool to answer questions about NERSC public documentation.

  consulting_docs_rag_mcp:
    description: "Retrieval-augmented MCP for internal consulting documentation"
    mcp_type: "mcp_stdio"
    command: "rag-mcp"
    args: [
      "--repo-url", "https://gitlab.nersc.gov/nersc/consulting/consulting-documentation.git",
      "--docs-path", "${ATHOS_WORKSPACE}/consulting_docs",
      "--chunk-size", "200",
      "--overlap", "50",
      "--query-name", "query_consulting_docs",
      "--query-docstring", "Query the NERSC internal consultant documentation"
    ]
    instructions: |
      Use the `query_consulting_docs` tool to answer questions about NERSC internal consultant documentation.

  chroma_mcp:
    description: "ChromaDB MCP server for persistent vector database operations"
    mcp_type: "mcp_stdio"
    command: "chroma-mcp"
    args: [
      "--client-type", "persistent",
      "--data-dir", "${ATHOS_WORKSPACE}/chroma"
    ]

  consulting_chroma_ro_mcp:
    description: "Read-only ChromaDB MCP server for combined tickets, NERSC docs, and consulting docs retrieval"
    mcp_type: "mcp_stdio"
    command: "chroma-mcp"
    args: [
      "--client-type", "persistent",
      "--data-dir", "data/chroma/aggregates/athos_eval_bundle_20260318_derived_tickets_v2"
    ]
    allowed_tools:
      - "chroma_list_collections"
      - "chroma_get_collection_info"
      - "chroma_get_collection_count"
      - "chroma_query_documents"
      - "chroma_get_documents"
    blocked_tools:
      - "chroma_create_collection"
      - "chroma_modify_collection"
      - "chroma_fork_collection"
      - "chroma_delete_collection"
      - "chroma_add_documents"
      - "chroma_update_documents"
      - "chroma_delete_documents"
    instructions: |
      Use Chroma as read-only retrieval over the combined consultant support
      database. It contains separate collections for public NERSC docs,
      internal consulting docs, and the derived ticket retrieval corpus. Before
      querying, list collections and choose collection names only from the
      returned list.


# Regular and custom tools (non-MCP)
tools:
  websearch:
    description: "DuckDuckGo search tool for general web queries"
    callable_name: "DuckDuckGoSearchTool"
    module_path: "smolagents.default_tools"
    parameters: {}
    framework: "smolagents"
  langgraph_websearch:
    description: "LangChain DuckDuckGo search tool for LangGraph flows"
    callable_name: "DuckDuckGoSearchRun"
    module_path: "langchain_community.tools"
    parameters: {}
    framework: "langgraph"
  webvisit:
    description: "Fetch and summarize webpages for agents"
    callable_name: "VisitWebpageTool"
    module_path: "smolagents.default_tools"
    parameters: {}
    framework: "smolagents"

  # You need a free tavily API key for this one:
  # https://python.langchain.com/docs/integrations/tools/tavily_search/
  langchain_tavily_search:
    description: "LangChain Tavily search engine tool for AI"
    module_path: "langchain_tavily"
    callable_name: "TavilySearch"
    parameters: {}
    framework: "langgraph"

  chroma_list_collections:
    description: "List ChromaDB collections"
    callable_name: "chroma_list_collections"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_create_collection:
    description: "Create a ChromaDB collection"
    callable_name: "chroma_create_collection"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_peek_collection:
    description: "Peek documents from a ChromaDB collection"
    callable_name: "chroma_peek_collection"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_get_collection_info:
    description: "Get ChromaDB collection info"
    callable_name: "chroma_get_collection_info"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_get_collection_count:
    description: "Get document count for a ChromaDB collection"
    callable_name: "chroma_get_collection_count"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_modify_collection:
    description: "Rename or update ChromaDB collection metadata"
    callable_name: "chroma_modify_collection"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_fork_collection:
    description: "Fork a ChromaDB collection"
    callable_name: "chroma_fork_collection"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_delete_collection:
    description: "Delete a ChromaDB collection"
    callable_name: "chroma_delete_collection"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_add_documents:
    description: "Add documents to a ChromaDB collection"
    callable_name: "chroma_add_documents"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_query_documents:
    description: "Query documents from a ChromaDB collection"
    callable_name: "chroma_query_documents"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_get_documents:
    description: "Fetch documents from a ChromaDB collection"
    callable_name: "chroma_get_documents"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_update_documents:
    description: "Update documents in a ChromaDB collection"
    callable_name: "chroma_update_documents"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_delete_documents:
    description: "Delete documents from a ChromaDB collection"
    callable_name: "chroma_delete_documents"
    module_path: "athos.tools.chroma"
    is_class: false


# Agent flows define the agent system
flows:

  # A bare agent with no tools
  smol_basic_agent:
    description: "Basic Smol agent without any tools"
    type: "smol_agent"
    agent_type: "tool_calling"
    model: "cborg_coder"

  # Web agent example
  smol_web_agent:
    description: "Web-enabled agent leveraging DuckDuckGo and webpage tools"
    type: "smol_agent"
    agent_type: "tool_calling"
    model: "o4_mini"
    tools: ["websearch", "webvisit"]

  # MCP-enabled agent example
  smol_filesystem_agent:
    description: "Code agent with filesystem MCP access"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    mcp_servers: ["filesystem_mcp"]

  # ServiceNow integration agent
  smol_servicenow_agent:
    description: "Code agent for interacting with ServiceNow"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    mcp_servers: ["servicenow_mcp"]
    additional_authorized_imports: ["json"]
    verbosity_level: 1  # 0: ERROR, 1: INFO, 2: DEBUG

  # Agent which can call the superfacility API tools
  smol_sfapi_agent:
    description: "Agent preconfigured for Superfacility API workflows"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    additional_authorized_imports: ["json"]
    mcp_servers: ["sfapi_mcp"]

  # Agent equipped with simple retrieval tools for NERSC docs and consulting docs
  smol_docs_agent:
    description: "Agent that uses documentation RAG MCP servers for retrieval"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    mcp_servers: ["docs_rag_mcp", "consulting_docs_rag_mcp"]
    verbosity_level: 2  # 0: ERROR, 1: INFO, 2: DEBUG

  # Agent that can interact with servicenow and read from docs
  smol_hpc_consultant:
    description: "Consultant agent that combines ServiceNow and documentation tools"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    additional_authorized_imports: ["json"]
    mcp_servers: ["servicenow_mcp", "docs_rag_mcp", "consulting_docs_rag_mcp", "filesystem_mcp"]
    instructions_path: "prompts/hpc_consultant_instructions.md"

  # LangGraph chatbot flow example
  lang_chat:
    description: "Minimal LangGraph chatbot flow using the CBORG chat model"
    type: "langgraph_chatbot"
    model: "gptoss"
    system_prompt_path: "prompts/langgraph_chatbot_demo_system_prompt.txt"
    # initial_history:
    #   - "Hello!"
    #   - "Hi there! I'm the LangGraph chatbot example ready to assist you."

  lang_agent:
    description: "LangChain agent configured as a simple chatbot without tools"
    type: "langchain_agent"
    model: "cborg_coder"
    system_prompt_path: "prompts/langgraph_chatbot_demo_system_prompt.txt"
    max_iterations: 20

  lang_web_agent:
    description: "LangChain agent demo with web search tool"
    type: "langchain_agent"
    model: "cborg_coder"
    tools: ["langchain_tavily_search"]
    system_prompt_path: "prompts/langchain_web_agent_instructions.md"
    max_iterations: 32

  # Agent which can call the superfacility API tools
  lang_sfapi_agent:
    description: "LangChain agent preconfigured for Superfacility API workflows"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["sfapi_mcp"]
    system_prompt_path: "prompts/lc_sfapi_agent_instructions.md"
    max_iterations: 12

  lang_servicenow_agent:
    description: "LangChain agent for interacting with ServiceNow incidents"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["servicenow_mcp"]
    system_prompt_path: "prompts/lang_servicenow_agent_instructions.md"
    max_iterations: 32

  # Agent equipped with simple retrieval tools for NERSC docs and consulting docs
  lang_docs_agent:
    description: "Agent that uses documentation RAG MCP servers for retrieval"
    type: "langchain_agent"
    model: "cborg_coder"
    mcp_servers: ["docs_rag_mcp", "consulting_docs_rag_mcp"]
    system_prompt_path: "prompts/lc_docs_agent_instructions.md"
    max_iterations: 32

  # MCP-enabled agent example
  lang_filesystem_agent:
    description: "Agent with filesystem MCP access"
    type: "langchain_agent"
    model: "cborg_coder"
    mcp_servers: ["filesystem_mcp"]
    system_prompt_path: "prompts/lc_filesystem_agent_instructions.md"
    max_iterations: 32

  lang_docs_react_agent:
    description: "Agent that uses documentation RAG MCP servers for retrieval"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["docs_rag_mcp", "consulting_docs_rag_mcp"]
    max_iterations: 32
    system_prompt_path: "prompts/docs_react_agent_instructions.md"

  lang_chroma_agent:
    description: "LangChain agent that uses the official Chroma MCP server"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["chroma_mcp"]
    max_iterations: 24
    system_prompt: |
      You are a ChromaDB assistant.
      Use the available MCP tools to inspect collections, query documents, and manage records.
      Prefer read operations before making changes, and clearly summarize any writes you perform.

  lang_hpc_consulting_agent:
    description: "Prototype read-only NERSC consultant support agent using ServiceNow and combined Chroma retrieval"
    type: "langchain_agent"
    model: "gptoss"
    mcp_servers:
      - "servicenow_ro_mcp"
      - "consulting_chroma_ro_mcp"
    max_iterations: 32
    system_prompt_path: "prompts/hpc_consulting_agent_system_prompt.txt"

  # Known issue: in the current SmolAgents MCP adapter path, some MCP tool
  # responses with multiple content items can be truncated to the first item.
  # Prefer `smol_chroma_agent` for reliable Chroma results until resolved upstream.
  smol_chroma_mcp_agent:
    description: "SmolAgents code agent using the official Chroma MCP server (buggy/experimental)"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    max_steps: 20
    additional_authorized_imports: ["json"]
    mcp_servers: ["chroma_mcp"]
    instructions: |
      Use Chroma MCP tools to inspect and query the configured database.
      Prefer read operations before writes and summarize any changes you make.
      When listing collections, always call `chroma_list_collections(limit=100, offset=0)`.

  smol_chroma_agent:
    description: "SmolAgents code agent with local ChromaDB tools"
    type: "smol_agent"
    agent_type: "tool_calling"
    model: "cborg_coder" #"claude_sonnet"
    max_steps: 20
    additional_authorized_imports: ["json"]
    tools:
      - chroma_list_collections
      - chroma_create_collection
      - chroma_peek_collection
      - chroma_get_collection_info
      - chroma_get_collection_count
      - chroma_modify_collection
      - chroma_fork_collection
      - chroma_delete_collection
      - chroma_add_documents
      - chroma_query_documents
      - chroma_get_documents
      - chroma_update_documents
      - chroma_delete_documents

# Logging configuration
logging_config:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: "file"
      filename: "logs/athos.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
    - type: "console"
