  # OpenAI GPT-4o model
  gpt_4o:
    model_id: "openai/gpt-4o"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # CBORG chat model
  cborg_chat:
    model_id: "lbl/cborg-chat:latest"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # CBORG coder model
  cborg_coder:
    model_id: "lbl/cborg-coder:latest"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.3
    max_tokens: 4096

  # Anthropic Claude Sonnet model
  claude_sonnet:
    model_id: "anthropic/claude-sonnet"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  # OpenAI o4-mini model
  o4_mini:
    model_id: "openai/o4-mini"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.5
    max_tokens: 1024

# Tools for web agent
tools:
  websearch:
    class_name: "DuckDuckGoSearchTool"
    module_path: "smolagents.default_tools"
    parameters: {}
  webvisit:
    class_name: "VisitWebpageTool"
    module_path: "smolagents.default_tools"
    parameters: {}

  # MCP Tools Examples
  # ServiceNow MCP server (stdio transport)
  servicenow_mcp:
    tool_type: "mcp_stdio"
    mcp_config:
      command: "python"
      args: ["-m", "servicenow_mcp"]
      env:
        SERVICENOW_INSTANCE_URL: "${SERVICENOW_INSTANCE_URL}"
        SERVICENOW_USERNAME: "${SERVICENOW_USERNAME}"
        SERVICENOW_PASSWORD: "${SERVICENOW_PASSWORD}"
    # Optional: specify a specific tool name from the MCP server
    # mcp_tool_name: "create_incident"

  # GitHub MCP server (stdio transport)
  github_mcp:
    tool_type: "mcp_stdio"
    mcp_config:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

  # Filesystem MCP server (stdio transport)
  filesystem_mcp:
    tool_type: "mcp_stdio"
    mcp_config:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/allowed/path"]

  # SQLite MCP server (stdio transport)
  sqlite_mcp:
    tool_type: "mcp_stdio"
    mcp_config:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-sqlite", "--db-path", "/path/to/database.db"]

  # Example SSE-based MCP server (remote transport)
  remote_mcp_example:
    tool_type: "mcp_sse"
    mcp_config:
      url: "https://api.example.com/mcp"
      headers:
        Authorization: "Bearer ${API_TOKEN}"
        Content-Type: "application/json"

