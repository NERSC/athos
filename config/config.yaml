execution_flows:
  # Simple chatbot for general HPC questions
  hpc_chatbot:
    type: "chatbot"
    model: "cborg_chat"
    system_prompt: |
      You are an HPC support chatbot. Answer questions about cluster usage, 
      job submission, software modules, and general HPC best practices.
      Keep responses concise but informative.
  
  # Code agent with no tools
  hpc_simple_agent:
    type: "code_agent"
    model: "gpt_4o"
    # system prompt: You are an HPC support chatbot.

  # Web agent example
  web_agent:
    type: "tool_calling_agent"
    model: "o4_mini"
    tools: ["websearch", "webvisit"]
    # Optionally, add a system_prompt to configure behavior

  # MCP-enabled agent example
  mcp_agent:
    type: "tool_calling_agent"
    model: "gpt_4o"
    tools: ["github_mcp", "filesystem_mcp"]
    system_prompt: |
      You are an AI assistant with access to GitHub and filesystem tools via MCP.
      You can help with repository management, file operations, and development tasks.
      Always be careful with file operations and ask for confirmation before making changes.

  # ServiceNow integration agent
  servicenow_agent:
    type: "tool_calling_agent"
    model: "claude_sonnet"
    tools: ["servicenow_mcp"]
    system_prompt: |
      You are a ServiceNow integration assistant. You can help create incidents,
      manage service requests, and interact with ServiceNow instances.
      Always provide clear summaries of actions taken.

  # Mixed tools agent (regular + MCP)
  mixed_tools_agent:
    type: "tool_calling_agent"
    model: "gpt_4o"
    tools: ["websearch", "github_mcp", "sqlite_mcp"]
    system_prompt: |
      You are a versatile assistant with access to web search, GitHub, and database tools.
      You can research topics online, manage code repositories, and query databases.
      Combine these capabilities to provide comprehensive assistance.

