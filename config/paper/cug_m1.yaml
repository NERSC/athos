# Frozen CUG M1 configuration for ATHOS-run experiments.
# Note: external coding-agent baselines are run outside ATHOS and imported via evals/import_runs.py.

workspace_dir: "${ATHOS_WORKSPACE}"

models:

  gptoss:
    description: "Open-weight GPT-OSS-120B via CBORG"
    #model_id: "gpt-oss-120b"
    model_id: "lbl/cborg-coder"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.3
    max_tokens: 16384

  claude_sonnet:
    description: "Anthropic Claude Sonnet via CBORG"
    model_id: "claude-sonnet"
    #model_id: "anthropic/claude-sonnet"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.7
    max_tokens: 2048

  mistral_large_3:
    description: "Mistral Large 3 via CBORG"
    model_id: "mistral-large-3"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.0
    max_tokens: 2048

  llama_4_maverick:
    description: "Llama 4 Maverick via CBORG"
    model_id: "amazon/llama-4-maverick"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.0
    max_tokens: 2048

  glm-5.3-flash:
    description: "GLM 5.3 FLASH via CBORG"
    model_id: "lbl/cborg-coder-max"
    api_key: "${CBORG_API_KEY}"
    api_base: "${CBORG_API_URL}"
    temperature: 0.3
    max_tokens: 16384

mcp_servers:
  chroma_mcp:
    description: "ChromaDB MCP server for persistent vector database operations"
    mcp_type: "mcp_stdio"
    command: "uvx"
    args: [
      "chroma-mcp",
      "--client-type", "persistent",
      "--data-dir", "${ATHOS_WORKSPACE}/chroma"
    ]
  chroma_ro_mcp:
    description: "Read-only ChromaDB MCP server for paper eval retrieval"
    mcp_type: "mcp_stdio"
    command: "chroma-mcp"
    args: [
      "--client-type", "persistent",
      "--data-dir", "${ATHOS_WORKSPACE}/chroma"
    ]
    allowed_tools: [
      "chroma_list_collections",
      "chroma_get_collection_info",
      "chroma_get_collection_count",
      "chroma_query_documents",
      "chroma_get_documents"
    ]
  filesystem_mcp:
    description: "Filesystem MCP server restricted to the paper eval bundle subtree"
    mcp_type: "mcp_stdio"
    command: "npx"
    args: [
      "-y",
      "@modelcontextprotocol/server-filesystem",
      "${ATHOS_WORKSPACE}/file_retrieval_corpus"
    ]
    allowed_tools: [
      "list_allowed_directories",
      "list_directory",
      "directory_tree",
      "read_file",
      "read_multiple_files",
      "search_files",
      "get_file_info"
    ]
    blocked_tools: [
      "write_file",
      "edit_file",
      "create_directory",
      "move_file"
    ]
    instructions: |
      Always use keyword arguments when invoking filesystem tools.
      Filesystem tools return strings only.
      search_files matches file names only, not file content. To search file content by keyword, use the search_file_contents tool instead.

tools:
  search_file_contents:
    description: "Search file contents by pattern within an allowed directory"
    callable_name: "create_search_file_contents_tool"
    module_path: "athos.tools.filesystem_search"
    framework: "langgraph"
    is_class: false
    parameters:
      allowed_root: "${ATHOS_WORKSPACE}/file_retrieval_corpus"
  chroma_list_collections:
    description: "List ChromaDB collections"
    callable_name: "chroma_list_collections"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_peek_collection:
    description: "Peek documents from a ChromaDB collection"
    callable_name: "chroma_peek_collection"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_get_collection_info:
    description: "Get ChromaDB collection info"
    callable_name: "chroma_get_collection_info"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_get_collection_count:
    description: "Get document count for a ChromaDB collection"
    callable_name: "chroma_get_collection_count"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_query_documents:
    description: "Query documents from a ChromaDB collection"
    callable_name: "chroma_query_documents"
    module_path: "athos.tools.chroma"
    is_class: false
  chroma_get_documents:
    description: "Fetch documents from a ChromaDB collection"
    callable_name: "chroma_get_documents"
    module_path: "athos.tools.chroma"
    is_class: false

flows:
  cug_lang_base_gptoss:
    description: "LangChain no-tool baseline on GPT-OSS"
    type: "langchain_agent"
    model: "gptoss"
    system_prompt_path: "../prompts/langgraph_chatbot_demo_system_prompt.txt"
    max_iterations: 20

  cug_lang_base_sonnet:
    description: "LangChain no-tool baseline on Claude Sonnet"
    type: "langchain_agent"
    model: "claude_sonnet"
    system_prompt_path: "../prompts/langgraph_chatbot_demo_system_prompt.txt"
    max_iterations: 20

  cug_lang_chroma_gptoss:
    description: "LangChain Chroma-retrieval baseline on GPT-OSS"
    type: "langchain_agent"
    model: "gptoss"
    mcp_servers: ["chroma_mcp"]
    max_iterations: 24
    system_prompt: |
      You are an HPC operations assistant.
      Use available Chroma retrieval tools to gather evidence before answering.
      Cite the retrieved evidence clearly in your final response.

  cug_lang_chroma_sonnet:
    description: "LangChain Chroma-retrieval baseline on Claude Sonnet"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["chroma_mcp"]
    max_iterations: 24
    system_prompt: |
      You are an HPC operations assistant.
      Use available Chroma retrieval tools to gather evidence before answering.
      Cite the retrieved evidence clearly in your final response.

  cug_lang_chroma_gptoss_opt:
    description: "LangChain Chroma-retrieval optimized prompt on GPT-OSS"
    type: "langchain_agent"
    model: "gptoss"
    mcp_servers: ["chroma_ro_mcp"]
    max_iterations: 24
    system_prompt_path: "../prompts/cug_lang_chroma_opt_system_prompt.txt"

  cug_lang_chroma_sonnet_opt:
    description: "LangChain Chroma-retrieval optimized prompt on Claude Sonnet"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["chroma_ro_mcp"]
    max_iterations: 24
    system_prompt_path: "../prompts/cug_lang_chroma_opt_system_prompt.txt"

  cug_lang_chroma_glm_5.3_flash_opt:
    description: "LangChain Chroma-retrieval optimized prompt on GLM-5.3-FLASH"
    type: "langchain_agent"
    model: "glm-5.3-flash"
    mcp_servers: ["chroma_ro_mcp"]
    max_iterations: 24
    system_prompt_path: "../prompts/cug_lang_chroma_opt_system_prompt.txt"

  cug_smol_chroma_gptoss:
    description: "SmolAgents coding-agent retrieval comparison row on GPT-OSS"
    type: "smol_agent"
    agent_type: "code"
    model: "gptoss"
    max_steps: 24
    additional_authorized_imports: ["json"]
    instructions_path: "../prompts/cug_lang_chroma_opt_system_prompt.txt"
    tools:
      - chroma_list_collections
      - chroma_get_collection_info
      - chroma_get_collection_count
      - chroma_query_documents
      - chroma_get_documents

  cug_smol_chroma_sonnet:
    description: "SmolAgents coding-agent retrieval comparison row on Claude Sonnet"
    type: "smol_agent"
    agent_type: "code"
    model: "claude_sonnet"
    max_steps: 24
    additional_authorized_imports: ["json"]
    instructions_path: "../prompts/cug_lang_chroma_opt_system_prompt.txt"
    tools:
      - chroma_list_collections
      - chroma_get_collection_info
      - chroma_get_collection_count
      - chroma_query_documents
      - chroma_get_documents

  cug_lang_filesystem_gptoss:
    description: "LangChain filesystem-tool baseline on GPT-OSS"
    type: "langchain_agent"
    model: "gptoss"
    mcp_servers: ["filesystem_mcp"]
    tools: ["search_file_contents"]
    max_iterations: 32
    system_prompt_path: "../prompts/cug_lang_filesystem_system_prompt.txt"

  cug_lang_filesystem_sonnet:
    description: "LangChain filesystem-tool baseline on Claude Sonnet"
    type: "langchain_agent"
    model: "claude_sonnet"
    mcp_servers: ["filesystem_mcp"]
    tools: ["search_file_contents"]
    max_iterations: 32
    system_prompt_path: "../prompts/cug_lang_filesystem_system_prompt.txt"

logging_config:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: "console"
