[project]
name = "rag-mcp"
version = "0.1.0"
description = "FastMCP server for BM25 retrieval over NERSC docs"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.10.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
