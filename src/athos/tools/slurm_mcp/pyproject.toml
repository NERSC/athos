[project]
name = "slurm-mcp"
version = "0.2.0"
description = "MCP Server for SLURM command execution (sacct, showquota, sinfo)"
authors = [
    {name = "NERSC", email = "support@nersc.gov"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
] 