[tool.poetry]
name = "athos-agents"
version = "0.1.0"
description = "Predefined agents for HPC support using ATHOS"
authors = ["NERSC"]
packages = [{ include = "athos" }]

[tool.poetry.dependencies]
python = ">=3.8"
athos-core = { path = "../athos-core", develop = true }
athos-tools = { path = "../athos-tools", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
