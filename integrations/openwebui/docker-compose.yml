services:
  pipelines:
    build:
      context: ../..
      dockerfile: integrations/openwebui/Dockerfile.pipelines
    image: athos-openwebui-pipelines:local
    container_name: athos-openwebui-pipelines
    ports:
      - "9099:9099"
    environment:
      - PIPELINES_API_KEY=0p3n-w3bu!
      - PIPELINES_DIR=/app/pipelines
      - ATHOS_PIPELINE_CONFIG_PATH=/workspace/config/config.yaml
      - ATHOS_PIPELINE_ENABLED_FLOWS=hpc_chatbot,web_agent,langgraph_chatbot_demo,langgraph_react_web_agent_demo
      - ATHOS_PIPELINE_DEFAULT_FLOW=hpc_chatbot
      - ATHOS_WORKSPACE=/workspace/workspace
      - CBORG_API_URL=${CBORG_API_URL:?must be set}
      - CBORG_API_KEY=${CBORG_API_KEY:?must be set}
      - TAVILY_API_KEY=${TAVILY_API_KEY:?must be set}

    volumes:
      - ./pipelines:/app/pipelines
      - ../../config:/workspace/config:ro
      - athos-workspace:/workspace/workspace
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: athos-openwebui-ui
    depends_on:
      - pipelines
    ports:
      - "3000:8080"
    environment:
      - WEBUI_AUTH=False
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
  athos-workspace:
